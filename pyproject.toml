[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nm"
version = "0.1.0"
description = "Numerical methods library for university course"
authors = [
    { name="Your Name" }
]
dependencies = [
    "matplotlib",
    "numpy",
    "scipy"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]
